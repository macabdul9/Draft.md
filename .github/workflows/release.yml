name: Package local installer
on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to attach installer assets to (leave empty to build only)'
        required: false
        type: string
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: npm ci
      - run: shellcheck -s bash install.sh packaging/shell-helpers.sh
      - run: npm run lint && npm test && npm run build
      - run: python3 scripts/package-release.py
        env:
          DRAFT_RELEASE_TAG: ${{ startsWith(inputs.release_tag, 'v') && inputs.release_tag || startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
      - run: python3 -m unittest discover -s packaging/tests -v
      - uses: actions/upload-artifact@v4
        with:
          name: draft-md-local-installation
          path: release/
  publish:
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: draft-md-local-installation
          path: release/
      - name: Publish versioned release assets
        run: |
          set -euo pipefail
          if gh release view "$DRAFT_RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$DRAFT_RELEASE_TAG" release/* --clobber
          else
            gh release create "$DRAFT_RELEASE_TAG" release/* --verify-tag --title "$DRAFT_RELEASE_TAG" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT_RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name || github.ref_name }}
